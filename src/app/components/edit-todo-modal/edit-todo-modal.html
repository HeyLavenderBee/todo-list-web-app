<main>
    <h3 mat-dialog-title>Editar tarefa: {{data.id}}</h3>
    <mat-form-field>
        <mat-label>Mude o nome da tarefa</mat-label>
        <input matInput [(ngModel)]="editedItem" />
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton (click)="cancel()">Cancelar</button>
        <button matButton [mat-dialog-close]="editedItem()" cdkFocusInitial>Editar</button>
    </mat-dialog-actions>
</main>
