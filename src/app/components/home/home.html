<main>
    <h1>Lista de Tarefas</h1>
    <div class="todo-list-container">
    <div>
        <input type="text" placeholder="Digite uma tarefa" [(ngModel)]="todo" />
        <button (click)="addTodoItem(todo)">+</button>
    </div>
        @for(item of todoList; track item.id){
            <div class="item">
                <input type="checkbox" /> {{item.name}}
                <button (click)="editTodoItem(item.id)">Editar</button>
            </div>
        }
    </div>
</main>
